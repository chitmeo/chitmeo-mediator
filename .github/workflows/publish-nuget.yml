name: Publish to NuGet

on:
  push:
    tags:
      - 'v*.*.*'

  workflow_dispatch:
    inputs:
      version:
        description: 'NuGet package version'
        required: true
        type: string
        default: '1.2.0'

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Get package version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ inputs.version }}"
          fi

          echo "Package version: $VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build project
        run: dotnet build \
          src/ChitMeo.Mediator/ChitMeo.Mediator.csproj \
          -c Release \
          --no-restore

      - name: Pack NuGet package
        shell: bash
        run: |
          mkdir -p ./artifacts

          dotnet pack \
            src/ChitMeo.Mediator/ChitMeo.Mediator.csproj \
            -c Release \
            --no-build \
            -o ./artifacts \
            -p:PackageVersion="${{ steps.version.outputs.VERSION }}"

      - name: Verify generated package
        shell: bash
        run: |
          echo "Generated packages:"
          ls -lah ./artifacts

          PACKAGE_COUNT=$(find ./artifacts -maxdepth 1 -type f -name "*.nupkg" | wc -l)

          if [ "$PACKAGE_COUNT" -eq 0 ]; then
            echo "No NuGet package was generated."
            exit 1
          fi

      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Verify NuGet login
        shell: bash
        run: |
          if [ -z "${{ steps.login.outputs.NUGET_API_KEY }}" ]; then
            echo "NuGet API key was not generated."
            exit 1
          fi

          echo "NuGet login succeeded."

      - name: Push package to NuGet.org
        shell: bash
        run: |
          dotnet nuget push "./artifacts/*.nupkg" \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source "https://api.nuget.org/v3/index.json"